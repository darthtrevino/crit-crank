name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYDATE_SDK_VERSION: "3.1.2"

jobs:
  lua-lint:
    name: Lua lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install luacheck
      - run: charsheet/tools/lint.sh

  game-build:
    name: Build game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Playdate SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/PlaydateSDK
          key: playdate-sdk-linux-${{ env.PLAYDATE_SDK_VERSION }}
      - name: Download Playdate SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/PlaydateSDK
          curl -fsSL "https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-${PLAYDATE_SDK_VERSION}.tar.gz" \
            | tar -xz -C ~/PlaydateSDK --strip-components=1
      - name: Build
        run: |
          export PLAYDATE_SDK_PATH=~/PlaydateSDK
          cd charsheet
          "$PLAYDATE_SDK_PATH/bin/pdc" source charsheet.pdx
      - uses: actions/upload-artifact@v4
        with:
          name: charsheet.pdx
          path: charsheet/charsheet.pdx

  charsync:
    name: charsync (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: charsync
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: charsync
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
