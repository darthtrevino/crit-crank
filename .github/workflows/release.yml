name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PLAYDATE_SDK_VERSION: "3.1.2"
  PLAYDATE_SDK_PATH: /home/runner/PlaydateSDK

jobs:
  build-charsync:
    name: Build charsync (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: charsync
            asset: charsync-linux
          - os: macos-latest
            binary: charsync
            asset: charsync-macos
          - os: windows-latest
            binary: charsync.exe
            asset: charsync-windows.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: charsync
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Prepare release binary
        run: |
          mkdir -p ../dist
          cp "target/release/${{ matrix.binary }}" "../dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build-charsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Cache Playdate SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/PlaydateSDK
          key: playdate-sdk-linux-${{ env.PLAYDATE_SDK_VERSION }}
      - name: Download Playdate SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/PlaydateSDK
          curl -fsSL "https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-${PLAYDATE_SDK_VERSION}.tar.gz" \
            | tar -xz -C ~/PlaydateSDK --strip-components=1
      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version=.*/version=${VERSION}/; s/^buildNumber=.*/buildNumber=${GITHUB_RUN_NUMBER}/" charsheet/source/pdxinfo
          cat charsheet/source/pdxinfo
      - name: Build
        run: |
          cd charsheet
          "$PLAYDATE_SDK_PATH/bin/pdc" source charsheet.pdx
          zip -qr ../crit-crank.pdx.zip charsheet.pdx
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" crit-crank.pdx.zip \
            dist/charsync-linux dist/charsync-macos dist/charsync-windows.exe \
            --title "Crit Crank $GITHUB_REF_NAME" --generate-notes --verify-tag
