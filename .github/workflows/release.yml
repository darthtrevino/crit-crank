name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PLAYDATE_SDK_VERSION: "3.1.2"
  PLAYDATE_SDK_PATH: /home/runner/PlaydateSDK

jobs:
  build-charsync:
    name: Build ${{ matrix.asset }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binary: no glibc floor, runs on any x86_64 Linux.
          - os: ubuntu-latest
            asset: charsync-linux
            targets: x86_64-unknown-linux-musl
          # Universal binary for both Apple Silicon and Intel Macs.
          - os: macos-latest
            asset: charsync-macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            asset: charsync-windows.exe
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: charsync
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: Build
        run: |
          IFS=, read -ra targets <<< "${{ matrix.targets }}"
          for target in "${targets[@]}"; do
            cargo build --release --locked --target "$target"
          done
      - name: Prepare release binary
        run: |
          mkdir -p ../dist
          out="../dist/${{ matrix.asset }}"
          case "${{ runner.os }}" in
            macOS)
              lipo -create -output "$out" \
                target/aarch64-apple-darwin/release/charsync \
                target/x86_64-apple-darwin/release/charsync
              lipo -info "$out"
              ;;
            Windows)
              cp "target/${{ matrix.targets }}/release/charsync.exe" "$out"
              ;;
            *)
              cp "target/${{ matrix.targets }}/release/charsync" "$out"
              file "$out"
              ;;
          esac
      - name: Sign and notarize macOS binary
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          for v in CERTIFICATE_P12 CERTIFICATE_PASSWORD SIGNING_IDENTITY API_KEY_P8 API_KEY_ID API_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }
          done
          out="../dist/${{ matrix.asset }}"
          work="$RUNNER_TEMP/signing"
          mkdir -p "$work"
          keychain="$work/build.keychain-db"
          keychain_pw="$(uuidgen)"

          echo "$CERTIFICATE_P12" | base64 --decode > "$work/cert.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$work/cert.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          codesign --force --timestamp --options runtime \
            --identifier com.christrevino.charsync \
            --keychain "$keychain" --sign "$SIGNING_IDENTITY" "$out"
          codesign --verify --strict --verbose=2 "$out"

          # Bare executables can't be stapled; Gatekeeper fetches the
          # notarization ticket online on first launch.
          echo "$API_KEY_P8" > "$work/AuthKey.p8"
          ditto -c -k "$out" "$work/charsync.zip"
          auth=(--key "$work/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          result="$(xcrun notarytool submit "$work/charsync.zip" "${auth[@]}" \
            --wait --timeout 30m --output-format json)"
          echo "$result"
          status="$(plutil -extract status raw - <<< "$result")"
          if [ "$status" != "Accepted" ]; then
            id="$(plutil -extract id raw - <<< "$result")"
            xcrun notarytool log "$id" "${auth[@]}" || true
            echo "::error::Notarization failed: $status"
            exit 1
          fi

          security delete-keychain "$keychain"
          rm -rf "$work"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build-charsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with:
          path: dist
          merge-multiple: true
      - name: Cache Playdate SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/PlaydateSDK
          key: playdate-sdk-linux-${{ env.PLAYDATE_SDK_VERSION }}
      - name: Download Playdate SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/PlaydateSDK
          curl -fsSL "https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-${PLAYDATE_SDK_VERSION}.tar.gz" \
            | tar -xz -C ~/PlaydateSDK --strip-components=1
      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version=.*/version=${VERSION}/; s/^buildNumber=.*/buildNumber=${GITHUB_RUN_NUMBER}/" charsheet/source/pdxinfo
          cat charsheet/source/pdxinfo
      - name: Build
        run: |
          cd charsheet
          "$PLAYDATE_SDK_PATH/bin/pdc" source charsheet.pdx
          zip -qr ../crit-crank.pdx.zip charsheet.pdx
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" crit-crank.pdx.zip \
            dist/charsync-linux dist/charsync-macos dist/charsync-windows.exe \
            --title "Crit Crank $GITHUB_REF_NAME" --generate-notes --verify-tag
