name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PLAYDATE_SDK_VERSION: "3.1.2"
  PLAYDATE_SDK_PATH: /home/runner/PlaydateSDK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Playdate SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/PlaydateSDK
          key: playdate-sdk-linux-${{ env.PLAYDATE_SDK_VERSION }}
      - name: Download Playdate SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/PlaydateSDK
          curl -fsSL "https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-${PLAYDATE_SDK_VERSION}.tar.gz" \
            | tar -xz -C ~/PlaydateSDK --strip-components=1
      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version=.*/version=${VERSION}/; s/^buildNumber=.*/buildNumber=${GITHUB_RUN_NUMBER}/" charsheet/source/pdxinfo
          cat charsheet/source/pdxinfo
      - name: Build
        run: |
          cd charsheet
          "$PLAYDATE_SDK_PATH/bin/pdc" source charsheet.pdx
          zip -qr ../crit-crank.pdx.zip charsheet.pdx
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" crit-crank.pdx.zip \
            --title "Crit Crank $GITHUB_REF_NAME" --generate-notes --verify-tag
